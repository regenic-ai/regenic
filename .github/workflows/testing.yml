name: Automated testing

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: testing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24.12.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci
      - name: Dependency inventory and non-gating vulnerability findings
        if: always()
        run: pnpm test:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-node-${{ matrix.node }}
          path: coverage/test-evidence/*.json
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:desktop
      - if: runner.os == 'macOS'
        run: pnpm test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: coverage/test-evidence/*.json
          if-no-files-found: error
          retention-days: 14

  soak:
    name: Nightly / lifecycle soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-soak
          path: coverage/test-evidence/*.json
          if-no-files-found: error

  compatibility:
    name: Compatibility / ${{ matrix.connector }} / ${{ matrix.sdk }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { connector: slack, sdk: stable }
          - { connector: whatsapp, sdk: stable }
          - { connector: dingtalk, sdk: stable }
          - { connector: dingtalk, sdk: candidate }
          - { connector: wecom, sdk: stable }
          - { connector: wecom, sdk: candidate }
          - { connector: telegram, sdk: stable }
          - { connector: discord, sdk: stable }
          - { connector: claude-code, sdk: candidate }
          - { connector: github-copilot, sdk: candidate }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:compatibility -- --connector ${{ matrix.connector }} --sdk ${{ matrix.sdk }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.connector }}-${{ matrix.sdk }}
          path: coverage/test-evidence/*.json
          if-no-files-found: error
          retention-days: 14

  release-consumer:
    name: Release / packed core consumer
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:consumer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-packed-consumer
          path: coverage/test-evidence/packed-consumer.json
          if-no-files-found: error
          retention-days: 30
