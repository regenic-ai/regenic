# Sealos API. DSH is a separate Launchpad app (deploy/sealos/dsh.yaml).
# Talk to it over cluster DNS, not a sidecar. Do not publish DSH from this
# Service. REGENIC_PERSONAL_API=1 exposes /v1/me for the desktop console.
#
# Disk is a StatefulSet claim (`data-regenic-0`). Restarting or replacing the
# pod remounts the same volume. Do not click Launchpad "开存储" on this app.
#
# Secrets stay out of git. Once:
#   cp deploy/sealos/secret.yaml.example deploy/sealos/secret.yaml
# Then:
#   kubectl apply -f deploy/sealos/secret.yaml -f deploy/sealos/dsh.yaml
#   kubectl apply -f deploy/sealos/regenic.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: regenic
  labels:
    app: regenic
    cloud.sealos.io/app-deploy-manager: regenic
  annotations:
    originImageName: jesonli/regenic-core:main
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
    deploy.cloud.sealos.io/resize: "10Gi"
spec:
  serviceName: regenic
  replicas: 1
  revisionHistoryLimit: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: regenic
  template:
    metadata:
      labels:
        app: regenic
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: jesonli/regenic-core:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 3000
          command: ["bash", "-lc"]
          args:
            - mkdir -p /data/home /data/tmp /data/blobs && exec pnpm --filter @regenic/api start
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: LISTEN_HOST
              value: "0.0.0.0"
            - name: REGENIC_PERSONAL_API
              value: "1"
            - name: REGENIC_DATABASE
              value: /data/regenic.db
            - name: REGENIC_BLOB_ROOT
              value: /data/blobs
            - name: REGENIC_ORG
              value: local-owner
            - name: REGENIC_DSH_BASE_URL
              value: http://regenic-dsh:3080
            - name: REGENIC_DSH_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: regenic-secrets
                  key: REGENIC_DSH_API_TOKEN
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: regenic-secrets
                  key: DEEPSEEK_API_KEY
            - name: HOME
              value: /data/home
            - name: TMPDIR
              value: /data/tmp
          resources:
            requests:
              cpu: 50m
              memory: 51Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: regenic
          cloud.sealos.io/app-deploy-manager: regenic
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: regenic
  labels:
    app: regenic
    cloud.sealos.io/app-deploy-manager: regenic
spec:
  selector:
    app: regenic
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regenic
  labels:
    app: regenic
    cloud.sealos.io/app-deploy-manager: regenic
    cloud.sealos.io/app-deploy-manager-domain: api-example
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - api.example.site
      secretName: wildcard-cert
  rules:
    - host: api.example.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regenic
                port:
                  number: 3000
