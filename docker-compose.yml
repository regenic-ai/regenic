services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regenic
      POSTGRES_PASSWORD: regenic
      POSTGRES_DB: regenic
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regenic -d regenic"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 3000
      LISTEN_HOST: "0.0.0.0"
      REGENIC_AUTHORITY_DRIVER: postgres
      DATABASE_URL: postgres://regenic:regenic@postgres:5432/regenic
      REGENIC_BLOB_ROOT: /data/blobs
      REGENIC_ORG: local-owner
      REGENIC_PERSONAL_API: "1"
      REDIS_URL: redis://redis:6379
    volumes:
      - api-data:/data
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://regenic:regenic@postgres:5432/regenic
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  api-data:
