<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <title>Regenic WhatsApp</title>
    <style>
      body { max-width: 640px; margin: 32px auto; padding: 0 20px; font: 14px/1.5 sans-serif; color: #1f2937; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      .note, .hint { color: #4b5563; }
      .hint { font-size: 13px; margin: 4px 0 0; }
      label { display: block; margin: 16px 0 0; font-weight: 600; }
      input[type="text"], input[type="password"] { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 8px; }
      .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
      .check input { margin-top: 3px; }
      details { margin: 20px 0; }
      summary { cursor: pointer; color: #374151; }
      button { margin-top: 18px; padding: 8px 14px; }
      .error { color: #b91c1c; }
      .ok { color: #166534; }
      #status { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p class="note" id="intro"></p>
    <label id="pairingLabel">
      <span></span>
      <input id="apiKey" type="password" autocomplete="off">
    </label>
    <p class="hint" id="pairingHint"></p>
    <label class="check" id="sendLabel">
      <input id="allowSend" type="checkbox">
      <span>
        <span id="sendTitle"></span>
        <span class="hint" id="sendHint"></span>
      </span>
    </label>
    <details>
      <summary id="advanced"></summary>
      <label id="originLabel">
        <span></span>
        <input id="apiOrigin" type="text" value="http://127.0.0.1:4370">
      </label>
      <p class="hint" id="originHint"></p>
      <label id="installIdLabel">
        <span></span>
        <input id="installationId" type="text">
      </label>
      <p class="hint" id="installIdHint"></p>
    </details>
    <button id="save" type="button"></button>
    <p id="status"></p>
    <script type="module" src="settings.js"></script>
  </body>
</html>
