<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <title>Regenic WhatsApp</title>
    <style>
      html, body { min-height: 100%; }
      body {
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 16px;
        font: 13px/1.45 sans-serif;
        color: #1f2937;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .status { margin: 0 0 12px; }
      .muted, .hint { color: #6b7280; font-size: 12px; }
      .hint { margin: 4px 0 8px; }
      label { display: block; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 7px; }
      button { width: 100%; margin-top: 8px; padding: 8px; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: wait; }
      button.primary { font-weight: 600; }
      .error { color: #b91c1c; }
      .ok { color: #166534; }
      #pageScanResult { margin-top: 8px; }
      #pairBlock { margin-bottom: 10px; }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p class="hint" id="dockHint"></p>
    <p class="status" id="status"></p>
    <div id="pairBlock">
      <label id="pairLabel"></label>
      <input id="pairingCode" type="password" autocomplete="off">
      <p class="hint" id="pairHint"></p>
      <button id="savePairing" type="button"></button>
    </div>
    <p class="muted" id="sendMode"></p>
    <button id="scanPage" class="primary" type="button"></button>
    <button id="testConnection" type="button"></button>
    <button id="openOptions" type="button"></button>
    <p class="muted" id="pageScanResult"></p>
    <script src="build-info.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
